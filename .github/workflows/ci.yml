name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend Checks
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Backend Checks
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check application starts
        run: python -c "from app import create_app; app = create_app('testing'); print('OK')"

      - name: Run API tests
        run: |
          python -c "
          from app import create_app
          app = create_app('testing')
          client = app.test_client()
          
          # Login
          r = client.post('/api/auth/login', json={'username':'admin','password':'1231231234'})
          assert r.status_code == 200, f'Login failed: {r.status_code}'
          token = r.get_json()['access_token']
          h = {'Authorization': f'Bearer {token}'}
          
          # Test key endpoints
          endpoints = [
              '/api/projects',
              '/api/test-suites',
              '/api/test-cases',
              '/api/executions',
              '/api/executions/stats',
              '/api/analytics/dashboard',
              '/api/browsers',
              '/api/environments',
              '/api/settings',
              '/api/notifications',
          ]
          
          for url in endpoints:
              r = client.get(url, headers=h)
              assert r.status_code == 200, f'{url} failed: {r.status_code}'
          
          print(f'All {len(endpoints) + 1} endpoint tests passed')
          "

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-dashboard .

      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 5000:5000 playwright-dashboard
          sleep 5
          curl -f http://localhost:5000/api/auth/login -X POST \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' || exit 1
          docker stop test-app
          docker rm test-app

  # Deploy to Render (optional)
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render
        run: |
          echo "Render auto-deploys from GitHub. Ensure RENDER_DEPLOY_HOOK is set."
          # Uncomment to use deploy hook:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
