# Render Blueprint - Full Stack Deployment
# Deploys backend + builds frontend into static/
services:
  - type: web
    name: playwright-dashboard
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm ci &&
      npm run build &&
      cp -r dist ../backend/static
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///instance/dashboard.db
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "18.19.0"
    disk:
      name: dashboard-data
      mountPath: /opt/render/project/src/backend/instance
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true
