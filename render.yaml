# Render Blueprint - Full Stack (React + Flask)
# No rootDir: runs from repository root so both frontend/ and backend/ are accessible
services:
  - type: web
    name: playwright-dashboard
    runtime: python
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt &&
      cd ../frontend && npm ci && npm run build &&
      rm -rf ../backend/static &&
      cp -r dist ../backend/static
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "18"
    disk:
      name: dashboard-data
      mountPath: /opt/render/project/src/backend/instance
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true
